version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # DOMPurify ships in the release package; jsdom and jQuery are test-only.
  # jQuery stays on the version osTicket 1.18 bundles, so only patch updates.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
